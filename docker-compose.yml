version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=file:./dev.db
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=change_me_in_prod
    volumes:
      - ./backend/prisma/dev.db:/app/prisma/dev.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
